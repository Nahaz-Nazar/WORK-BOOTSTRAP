<!DOCTYPE html>
<html>
<head>
  <title>Travel Website</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

  <!-- Bootstrap required JS (NO custom JS written) -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>

<body>

<!-- ================= CAROUSEL ================= -->
<div id="travel" class="carousel slide" data-ride="carousel">

  <!-- Indicators -->
  <ul class="carousel-indicators">
    <li data-target="#travel" data-slide-to="0" class="active"></li>
    <li data-target="#travel" data-slide-to="1"></li>
    <li data-target="#travel" data-slide-to="2"></li>
  </ul>

  <!-- Slides -->
  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="https://t3.ftcdn.net/jpg/12/61/62/58/360_F_1261625896_moxQeeYntW01yx5WtChl5kNRrRnn6Hmg.jpg"
           class="d-block w-100" height="500">
      <div class="carousel-caption">
        <h3>Alappuzha</h3>
        <p>Beautiful backwaters of Kerala</p>
      </div>
    </div>

    <div class="carousel-item">
      <img src="https://t3.ftcdn.net/jpg/00/59/46/64/360_F_59466409_IjrcA9OXD4qVCBSFHsm87Dxl53rUNKsV.jpg"
           class="d-block w-100" height="500">
      <div class="carousel-caption">
        <h3>Kovalam</h3>
        <p>Relax at the beach</p>
      </div>
    </div>

    <div class="carousel-item">
      <img src="https://lp-cms-production.imgix.net/2022-03/shutterstockRF_606110843.jpg"
           class="d-block w-100" height="500">
      <div class="carousel-caption">
        <h3>Trivandrum</h3>
        <p>Capital city of Kerala</p>
      </div>
    </div>

  </div>

  <!-- Controls -->
  <a class="carousel-control-prev" href="#travel" data-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </a>

  <a class="carousel-control-next" href="#travel" data-slide="next">
    <span class="carousel-control-next-icon"></span>
  </a>

</div>

<br>

<!-- ================= BOOK NOW BUTTON ================= -->
<div class="text-center">
  <button class="btn btn-info"
          data-toggle="modal"
          data-target="#bookModal">
    Book Now
  </button>
</div>

<!-- ================= MODAL POPUP ================= -->
<div class="modal fade" id="bookModal">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h4 class="modal-title">Booking Details</h4>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>

      <div class="modal-body">
        <p>Kerala Travel Package</p>
        <p>✔ Alappuzha Backwaters</p>
        <p>✔ Kovalam Beach</p>
        <p>✔ Trivandrum City Tour</p>
        <p>Price: ₹12,000 per person</p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-danger" data-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>

<!-- ================= INFO TOOLTIP ================= -->
<div class="text-center mt-3">
  <button class="btn btn-secondary"
          data-toggle="tooltip"
          title="Click Book Now to view package details">
    ℹ Info
  </button>
</div>

</body>
</html>
