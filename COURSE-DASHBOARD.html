<!DOCTYPE html>
<html lang="en">
     <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Course Progress Dashboard</title>

          <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
          <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
          <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
     </head>
     <body>
<div class="container py-5">
<div class="row justify-content-left">
<nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-4">
          <li class="breadcrumb-item"><a href="https://www.mashupstack.com">Home</a></li>
          <li class="breadcrumb-item"><a href="https://www.mashupstack.com/list-courses">Courses</a></li>
          <li class="breadcrumb-item"><a href="https://www.mashupstack.com">Web Development</a></li>
      </ol>
      </nav>
      </div>

     <div class="text-center mb-4">
          <h3>
                Web Development Course
               <span class="badge badge-secondary">New</span>
          </h3>
      </div>

               <div class="text-center mb-4">
                    <div class="btn-group" role="group" aria-label="Course controls">
                         <button type="button" class="btn btn-success">Start</button>
                         <button type="button" class="btn btn-primary">Pause</button>
                         <button type="button" class="btn btn-danger">Reset</button>
                    </div>
               </div>

               <div class="mb-3">
                    <div class="progress" style="height: 28px;">
                         <div class="progress-bar progress-bar-striped bg-success" role="progressbar" style="width:100%" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">HTML — 100% completed <span class="sr-only">100% Complete</span></div>
                    </div>
               </div>

               <div class="mb-3">
                    <div class="progress" style="height: 28px;">
                         <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width:75%" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">CSS — 75% completed <span class="sr-only">75% Complete</span></div>
                    </div>
               </div>

               <div class="mb-3">
                    <div class="progress" style="height: 28px;">
                         <div class="progress-bar bg-warning" role="progressbar" style="width:50%" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">JavaScript — 50% completed <span class="sr-only">50% Complete</span></div>
                    </div>
               </div>

               <div class="mb-4">
                    <div class="progress" style="height: 28px;">
                         <div class="progress-bar bg-danger" role="progressbar" style="width:25%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">Bootstrap — 25% completed <span class="sr-only">25% Complete</span></div>
                    </div>
               </div>

               <div class="text-center">
                    <ul class="pagination justify-content-center">
                         <li class="page-item active"><a class="page-link" href="#">1</a></li>
                         <li class="page-item"><a class="page-link" href="#">2</a></li>
                         <li class="page-item disabled"><a class="page-link" href="#">3</a></li>
                    </ul>
               </div>
          </div>
     </body>
</html>
