<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEEDBACK FORM</title>
    
 <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
 <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
 <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>


</head>
<body>
    <div class="container py-5">

        <!-- Centered card container -->
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">

                        <!-- Form title -->
                        <h1 class="h4 mb-4 text-center">Website Feedback</h1>

                        <!-- Feedback form -->
                        <form>
                            <!-- Name field -->
                            <div class="mb-3">
                                <label for="nameInput" class="form-label">Name</label>
                                <input type="text" class="form-control" id="nameInput" placeholder="Enter your name">
                            </div>

                            <!-- Email field -->
                            <div class="mb-3">
                                <label for="emailInput" class="form-label">Email</label>
                                <input type="email" class="form-control" id="emailInput" placeholder="you@example.com">
                            </div>

                            <!-- Feedback textarea -->
                            <div class="mb-3">
                                <label for="feedbackInput" class="form-label">Feedback</label>
                                <textarea class="form-control" id="feedbackInput" rows="4" placeholder="Share your feedback..."></textarea>
                            </div>

                            <!-- Dropdown for source -->
                            <div class="mb-3">
                                <label for="sourceSelect" class="form-label">How did you find the site?</label>
                                <select class="form-select" id="sourceSelect" name="source">
                                    <option value="" selected disabled>Select an option</option>
                                    <option value="search">Search engine</option>
                                    <option value="social">Social media</option>
                                    <option value="referral">Referral</option>
                                    <option value="ad">Advertisement</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            <!-- Satisfaction rating (radio buttons) -->
                            <div class="mb-3">
                                <label class="form-label">Satisfaction Level</label>
                                <div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="satisfaction" id="satisfaction1" value="1">
                                        <label class="form-check-label" for="satisfaction1">
                                            1 - Very dissatisfied
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="satisfaction" id="satisfaction2" value="2">
                                        <label class="form-check-label" for="satisfaction2">
                                            2 - Dissatisfied
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="satisfaction" id="satisfaction3" value="3">
                                        <label class="form-check-label" for="satisfaction3">
                                            3 - Neutral
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="satisfaction" id="satisfaction4" value="4">
                                        <label class="form-check-label" for="satisfaction4">
                                            4 - Satisfied
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="satisfaction" id="satisfaction5" value="5">
                                        <label class="form-check-label" for="satisfaction5">
                                            5 - Very satisfied
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Submit button -->
                            <button type="submit" class="btn btn-primary w-100">Submit Feedback</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

</body>
</html>
